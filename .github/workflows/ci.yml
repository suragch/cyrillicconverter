name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install SQLite3 development library
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Get Backend Dependencies
        working-directory: backend
        run: dart pub get

      - name: Analyze Backend
        working-directory: backend
        run: dart analyze --fatal-infos

      - name: Run Backend Tests
        working-directory: backend
        run: dart test

      - name: Build Backend AOT CLI Bundle
        working-directory: backend
        run: dart build cli -t bin/server.dart -o build/cli/

  frontend-checks:
    name: Frontend Tests & Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze Frontend
        working-directory: frontend
        run: flutter analyze --fatal-infos

      - name: Run Frontend Tests
        working-directory: frontend
        run: flutter test

      - name: Build Frontend Web Release
        working-directory: frontend
        run: flutter build web --release
