name: frontend
description: "Cyrillic to Traditional Mongolian Converter and Dictionary"
publish_to: 'none'
version: 1.1.2+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  material_ui: ^1.9.0
  mongol_code: ^1.0.4
  mongol: ^11.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Menksoft
      fonts:
        - asset: assets/fonts/MQG8F02.ttf
