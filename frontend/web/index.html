<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Кирилл бичгийг уламжлалт монгол бичиг рүү хөрвүүлэх, олон утгат үг болон толь бичиг шалгах цахим систем.">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Монгол бичиг">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Кирилл ➜ ᠮᠣᠩᠭᠣᠯ Хөрвүүлэгч & Толь бичиг</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/MQG8F02.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
  <div id="splash">
    <div class="splash-spinner"></div>
    <div class="splash-title">Кирилл - Монгол бичиг хөрвүүлэгч</div>
  </div>
  <style>
    @font-face {
      font-family: 'Menksoft';
      src: url('assets/assets/fonts/MQG8F02.ttf') format('truetype');
      font-display: swap;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    .splash-title {
      margin-top: 16px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #475569;
    }
    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    function removeSplash() {
      const splash = document.getElementById('splash');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    const observer = new MutationObserver((mutations, obs) => {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        removeSplash();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
