services:
  pocketbase:
    build:
      context: ./deploy/pocketbase
    restart: always
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      - PORT=8080
      - POCKETBASE_URL=http://pocketbase:8090
      - DB_PATH=/data/dictionary.db
      - CORS_ORIGIN=*
    volumes:
      - ./data:/data
    depends_on:
      - pocketbase
